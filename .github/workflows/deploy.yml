name: Deploy Santa to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
      - name: Build the allowlisted production artifact
        run: python3 scripts/build.py
      - name: Validate content and packaging
        run: python3 scripts/check.py
      - name: Test offline and update logic
        run: node scripts/test-service-worker.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
